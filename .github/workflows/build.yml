# WiFiTalk: builds the unsigned iPhone IPA (for Sideloadly) and the Windows companion WiFiTalk.exe.
# A pushed tag v* attaches both to a GitHub Release.
name: Build WiFiTalk

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-companion:
    name: Build and test the Windows companion
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build WiFiTalk.exe with the C# compiler built into Windows
        shell: pwsh
        run: ./windows/build.ps1

      - name: Run the companion and test its protocol
        shell: pwsh
        run: |
          $p = Start-Process windows/WiFiTalk.exe -PassThru
          Start-Sleep 4
          python windows/test_companion.py
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiTalk-Windows
          path: windows/WiFiTalk.exe
          if-no-files-found: error
          retention-days: 14

  iphone-app:
    name: Build the unsigned iPhone IPA
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Add the Firebase config from the repository secret
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$PLIST_B64" ]; then
            echo "$PLIST_B64" | base64 --decode > ios/WiFiTalk/GoogleService-Info.plist
            plutil -lint ios/WiFiTalk/GoogleService-Info.plist
          else
            echo "No Firebase secret: the assistant is left out of this build"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for a physical iPhone without signing
        env:
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/WiFiTalk.xcodeproj \
            -scheme WiFiTalk \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            APP_CHECK_DEBUG_TOKEN="${APP_CHECK_DEBUG_TOKEN:-}" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path="ios/build/Build/Products/Release-iphoneos/WiFiTalk.app"
          test -d "$app_path"
          mkdir -p artifact/Payload
          ditto "$app_path" "artifact/Payload/WiFiTalk.app"
          cd artifact
          /usr/bin/zip -qry WiFiTalk-unsigned.ipa Payload
          shasum -a 256 WiFiTalk-unsigned.ipa > WiFiTalk-unsigned.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiTalk-unsigned-IPA
          path: |
            artifact/WiFiTalk-unsigned.ipa
            artifact/WiFiTalk-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach the app and the companion to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-companion, iphone-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifact
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/WiFiTalk-unsigned.ipa
            artifact/WiFiTalk-unsigned.ipa.sha256
            artifact/WiFiTalk.exe
