# WiFiTalk iPhone app (XcodeGen). Built unsigned by .github/workflows/build-ipa.yml.
name: WiFiTalk
options:
  bundleIdPrefix: io.github.ibnkabed
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
# Firebase AI Logic (hybrid on-device + cloud AI), App Check and Remote Config
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.2.0
targets:
  WiFiTalk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WiFiTalk
        excludes:
          - "GoogleService-Info.plist"
      # written by CI from a repository secret; absent in a plain checkout (the app then hides the assistant)
      - path: WiFiTalk/GoogleService-Info.plist
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ibnkabed.wifitalk
        PRODUCT_NAME: WiFiTalk
        INFOPLIST_FILE: WiFiTalk/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        APP_CHECK_DEBUG_TOKEN: ""
    dependencies:
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseRemoteConfig
